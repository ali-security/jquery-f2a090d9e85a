name: build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '0.10'

      - name: Print tool versions
        run: node --version && npm --version

      # Resolve devDependencies as of the 1.11.1 release so grunt-contrib-uglify
      # pulls the uglify-js that produced the published dist/jquery.min.js.
      - name: Install dependencies (registry time machine at release date)
        run: |
          npm config set registry "https://:2014-05-01T18%3A05%3A32.863Z@time-machines-npm.sealsecurity.io/"
          npm install

      # The package's `build` script is `npm install && grunt`; install ran above.
      # build/tasks/build.js stamps @DATE with new Date() and the uglify banner
      # uses the current year, so pin the clock to the original 1.11.1 build time
      # (dist/jquery.js header "Date: 2014-05-01T17:42Z") for reproducible output.
      - name: Build (grunt)
        run: |
          sudo apt-get update
          sudo apt-get install -y faketime
          faketime '2014-05-01 17:42:30' ./node_modules/.bin/grunt

      - name: Generate dist/cdn release copies
        run: |
          node <<'EOF'
          var fs = require("fs");

          var pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          var version = pkg.version;

          var devFile = "dist/jquery.js";
          var minFile = "dist/jquery.min.js";
          var mapFile = "dist/jquery.min.map";

          var cdnFolder = "dist/cdn";

          var releaseFiles = {
              "jquery-VER.js": devFile,
              "jquery-VER.min.js": minFile,
              "jquery-VER.min.map": mapFile,
              "jquery.js": devFile,
              "jquery.min.js": minFile,
              "jquery.min.map": mapFile,
              "jquery-latest.js": devFile,
              "jquery-latest.min.js": minFile,
              "jquery-latest.min.map": mapFile
          };

          if (!fs.existsSync(cdnFolder)) {
              fs.mkdirSync(cdnFolder);
          }

          Object.keys(releaseFiles).forEach(function (key) {
              var text,
                builtFile = releaseFiles[key],
                unpathedFile = key.replace(/VER/g, version),
                releaseFile = cdnFolder + "/" + unpathedFile;

              if (/\.map$/.test(releaseFile)) {
                // Map files need to reference the new uncompressed name;
                // assume that all files reside in the same directory.
                // "file":"jquery.min.js","sources":["jquery.js"]
                text = fs.readFileSync(builtFile, "utf8")
                  .replace(/"file":"([^"]+)","sources":\["([^"]+)"\]/,
                    "\"file\":\"" + unpathedFile.replace(/\.min\.map/, ".min.js") +
                    "\",\"sources\":[\"" + unpathedFile.replace(/\.min\.map/, ".js") + "\"]");
                fs.writeFileSync(releaseFile, text);
              } else if (/\.min\.js$/.test(releaseFile)) {
                // Remove the source map comment; it causes way too many problems.
                // Keep the map file in case DevTools allow manual association.
                text = fs.readFileSync(builtFile, "utf8")
                  .replace(/\/\/# sourceMappingURL=\S+/, "");
                fs.writeFileSync(releaseFile, text);
              } else if (builtFile !== releaseFile) {
                text = fs.readFileSync(builtFile);
                fs.writeFileSync(releaseFile, text);
              }
          });

          console.log("Generated dist/cdn files for version " + version);
          EOF

      - name: Pack
        run: |
          npm pack
          ls -l jquery-*.tgz
          tar tzf jquery-*.tgz | sort

      - uses: actions/upload-artifact@v4
        with:
          name: jquery-npm-package
          path: jquery-*.tgz
          if-no-files-found: error
